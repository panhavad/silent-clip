name: slientclip

services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    image: slientclip-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      YOUTUBE_PRIVACY: ${YOUTUBE_PRIVACY:-public}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_POST_MODE: ${TIKTOK_POST_MODE:-direct}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      APP_SECRET: ${APP_SECRET:-}
      PUBLISH_DRY_RUN: ${PUBLISH_DRY_RUN:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      REQUIRE_APPROVAL: ${REQUIRE_APPROVAL:-true}
      MAX_SERVER_STREAMERS: ${MAX_SERVER_STREAMERS:-10}
      MAX_SERVER_WATCHERS: ${MAX_SERVER_WATCHERS:-50}
      TWITCH_AUTH_TOKEN: ${TWITCH_AUTH_TOKEN:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      UPDATER_URL: http://updater:9000/hooks/github
    volumes:
      - data:/data

  # Watches the private GitHub repo and rebuilds `app` on every push.
  updater:
    build: ./updater
    image: slientclip-updater
    restart: unless-stopped
    environment:
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      UPDATE_POLL_INTERVAL: ${UPDATE_POLL_INTERVAL:-60}
      GIT_REMOTE_URL: ${GIT_REMOTE_URL:-}
      COMPOSE_PROJECT: slientclip
      REPO_DIR: /repo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_HOST_PATH:-.}:/repo

volumes:
  data:
