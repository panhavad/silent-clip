<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlientClip - watching</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    main { max-width: none; padding: 14px; }
    .monitors { grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
    @media (max-width: 640px) { main { padding: 8px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo"><i data-i="scissors"></i></div>SlientClip<span class="ver hidden"></span></div>
    <span class="muted small win-title">Foreground watcher</span>
    <span class="spacer"></span>
    <button class="btn sm update-pill hidden"></button>
    <a class="btn sm" href="/app#clips" target="slientclip-dashboard">Clip library<i data-i="external"></i></a>
  </header>
  <main><div class="monitors"></div></main>
  <script type="module" src="/js/watch.js"></script>
</body>
</html>
