<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - SlientClip</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="panel auth-card">
      <a class="brand" href="/" title="About SlientClip" style="justify-content:center;font-size:26px;text-decoration:none;color:inherit"><div class="logo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg></div>SlientClip</a>
      <p class="muted" style="text-align:center;margin:0">Auto-clip the most viral Twitch moments into Shorts, TikToks &amp; Reels.</p>
      <a class="btn google-btn hidden" href="/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </a>
      <div class="divider google-divider hidden">or use email</div>
      <form class="grid auth-form" style="gap:10px">
        <label class="field name-field hidden">Name<input type="text" name="name" autocomplete="name"></label>
        <label class="field">Email<input type="email" name="email" required autocomplete="email"></label>
        <label class="field">Password<input type="password" name="password" required minlength="8" autocomplete="current-password"></label>
        <button class="btn primary" style="justify-content:center">Sign in</button>
      </form>
      <div class="small muted" style="text-align:center"><span class="switch-text">No account?</span> <a href="#" class="switch">Create one</a></div>
      <div class="notice info hidden"></div>
      <div class="error small" style="color:var(--bad);text-align:center"></div>
      <div class="small muted ver-line hidden" style="text-align:center;opacity:.75"></div>
    </div>
  </div>
  <script type="module">
    const $ = (s) => document.querySelector(s);
    // Already signed in: go straight to the app.
    if ((await fetch('/api/me', { credentials: 'same-origin' })).ok) location.replace('/app');
    const cfg = await (await fetch('/api/config')).json();
    if (cfg.googleLogin) { $('.google-btn').classList.remove('hidden'); $('.google-divider').classList.remove('hidden'); }
    if (!cfg.allowRegistration) $('.switch').parentElement.classList.add('hidden');
    if (cfg.build) {
      const { versionTitle } = await import('/js/version.js');
      $('.ver-line').textContent = `v${cfg.build.version}${cfg.build.commit ? ` · ${cfg.build.commit}` : ''}`;
      $('.ver-line').title = versionTitle(cfg.build);
      $('.ver-line').classList.remove('hidden');
    }
    const err = new URLSearchParams(location.search).get('error');
    if (err) $('.error').textContent = err;
    const notice = new URLSearchParams(location.search).get('notice');
    const showNotice = (m) => { $('.notice').textContent = m; $('.notice').classList.remove('hidden'); $('.error').textContent = ''; };
    if (notice) showNotice(notice);
    let register = false;
    $('.switch').onclick = (e) => {
      e.preventDefault();
      register = !register;
      $('.name-field').classList.toggle('hidden', !register);
      $('.auth-form button').textContent = register ? 'Create account' : 'Sign in';
      $('.switch-text').textContent = register ? 'Have an account?' : 'No account?';
      $('.switch').textContent = register ? 'Sign in' : 'Create one';
    };
    // Links from the product page ("Start free") open the sign-up form directly.
    if (new URLSearchParams(location.search).has('signup') && cfg.allowRegistration) $('.switch').click();
    $('.auth-form').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const res = await fetch(register ? '/api/auth/register' : '/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: f.elements.name.value, email: f.elements.email.value, password: f.elements.password.value }),
      });
      const data = await res.json().catch(() => ({}));
      const next = new URLSearchParams(location.search).get('next') || '/app';
      if (res.status === 202 || res.status === 403) { showNotice(data.message || data.error); if (res.status === 202) f.reset(); return; }
      if (res.ok) location.href = /^\/(?!\/)/.test(next) ? next : '/app'; else $('.error').textContent = data.error || 'Sign in failed';
    };
  </script>
</body>
</html>
